<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WPU Desk</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo" aria-hidden="true">W</span><span>WPU Desk</span></div>
  <div class="top-meta" id="topMeta"></div>
  <div class="top-actions">
    <button class="btn ghost" id="btnApprovals" type="button">Approvals <span class="badge" id="apprCount">0</span></button>
    <button class="btn ghost" id="btnSecrets" type="button">Secrets</button>
    <button class="btn primary" id="btnNewSite" type="button">+ New site</button>
  </div>
</header>
<div class="layout">
  <aside class="sidebar">
    <input class="search" id="siteSearch" type="search" placeholder="Search sites" aria-label="Search sites">
    <nav id="siteList" aria-label="Client sites"></nav>
    <button class="btn ghost full" id="btnHome" type="button">All recent jobs</button>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div class="modal-back" id="modalBack" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head"><h2 id="modalTitle"></h2><button class="btn ghost icon" id="modalClose" type="button" aria-label="Close">&times;</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/app.js"></script>
</body>
</html>
